# 行业代码前缀 → 经营模式 + 零增长 PE 参考区间
# 键为证监会行业代码前缀（baostock 行业字段形如 "C15酒、饮料和精制茶制造业"）
# zero_pe 为教程给出的零增长假设下 PE 区间（在 r=10% 下推导）

# 注意匹配顺序：先匹配到的生效，故把特殊前缀（如 C30）排在通用前缀（C）之前。
mode_rules:
  - mode: 资本型
    prefixes: ["J66", "J67", "J68", "J69"]
    zero_pe: [3, 6]
  - mode: 项目型
    prefixes: ["B", "D", "E", "K", "G5", "G6",
               "C25", "C26", "C30", "C31", "C32", "C33", "C22"]
    zero_pe: [6, 10]
  - mode: 运营型
    prefixes: ["F", "H", "I", "L", "M", "N", "O", "P", "Q", "R", "S", "A"]
    zero_pe: [10, 15]
  - mode: 产品型
    prefixes: ["C"]
    zero_pe: [7, 8]

default:
  mode: 运营型
  zero_pe: [10, 15]

# 财务特征修正：仅对「产品型」做覆盖，避免把渠道型制造业误判为产品型
overrides:
  product_to_operation:
    gross_margin_max: 22      # 毛利率 < 22%
    sale_expense_ratio_min: 18 # 且销售费用率 > 18% → 改判运营型
