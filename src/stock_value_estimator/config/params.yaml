# 全局参数（v2.8）
# 所有可调数值集中在此，代码内不再散落魔法数字。
# 修改后无需改代码，重载配置即生效。

version: "2.8"

# ── 要求回报率 r ──────────────────────────────────────────
# 风险溢价必须与「零增长区间在 r=10% 下推导」这一前提自洽。
# 教程参数表给的 Rf+3~4% 在 Rf=2% 时只有 5.6%，等于用低利率给高估值，故整体上移。
erp:
  产品型: 0.060
  运营型: 0.080
  项目型: 0.085
  资本型: 0.085
erp_growth_extra: 0.015   # 成长期额外溢价

# ── 永续增长率 g ──────────────────────────────────────────
g_cap: 0.05               # 长期名义 GDP 上限（硬约束）
g_growth_ratio: 0.5       # 成长期：g = min(营收CAGR × ratio, cap, r−2pp)
g_mature: 0.025           # 成熟期常规
g_mature_saturated: -0.005 # 成熟期但营收负增长
g_decline: -0.01          # 衰退期
g_soft_ratio: 0.5         # 利润下滑但现金流健康 → g × ratio（对折）
g_r_spread: 0.02          # g 与 r 的最小间距

# ── 等级与安全边际 ────────────────────────────────────────
grade:
  A: 80
  B: 70
  C: 50
mos:
  A: 0.15
  B: 0.20
  C: 0.25
  D: 0.30

# ── 合理区间与软收缩 ──────────────────────────────────────
fair_band: [0.90, 1.10]   # 合理区间 = 公平价 × [L, H]
soft_clamp_k: 0.33        # 越界部分保留 1/3 偏离（只压上限，不抬下限）

# ── 单期同比噪音带 ────────────────────────────────────────
noise_band: 0.05          # ±5% 内视为「持平」

# ── 趋势拐点（L2.5）──────────────────────────────────────
trend:
  long_min: 0.03          # L ≥ 3% 才算「长期向上」
  short_max: -0.05        # S ≤ −5% 才算「短期掉头」
  decel_ratio: 0.4        # 增速只剩不到四成
  decel_gap: 0.10         # 且绝对落差 ≥10pp（否则只是「不增长」不是「掉头」）
  lag_yoy: -0.30          # 年报滞后预警：最新一期 ≤ −30% 且年报仍稳定
  rebound_yoy: 0.02       # 已判拐点但最新一期 > +2% → 标「已止跌」
  cyclic_gm_std: 0.08     # 毛利率 σ > 8% → 强周期特征

# ── 利润反复暴跌（H6）─────────────────────────────────────
crash:
  min_times: 2            # ≥2 次
  drop: -0.40             # 单年跌幅 > 40%
  lookback: 8             # 回溯年数
  cyclic_exempt_gm_std: 0.08  # 强周期豁免阈值

# ── 现金含量 ──────────────────────────────────────────────
cash_quality_min: 0.80    # 低于此视为「现金流未提供支撑」
cash_quality_soft: 0.70   # 低于此计入减分 S1
ocf_yoy_bad: -0.20        # 年报 OCF 同比低于此视为恶化
profit_rebound: 0.10      # 最新一期归母同比 ≥ 此值 → 视为已回升，
                          # 「近三年 ≥2 年负增长」不再单独触发下滑判定。
                          # 实例：中油资本 +29.3%、中芯国际 +94.2%——历史有负增长
                          # 但当下已恢复，g 归零/对折会把复苏期企业误判为收缩期

# ── 限售股解禁（S7）───────────────────────────────────────
unlock:
  future_days: 365        # 未来一年内的解禁 → 提前预警（用户 2026-10-20 定为全年）
  recent_days: 60         # 近 60 天已解禁 → 抛压正在释放
  ratio_soft: 0.05        # 占总股本 ≥5% 触发减分
                          # 依据：<5% 的抛压多数可被日常成交消化；
                          # 股权激励类解禁通常 <1%，天然被这条线滤掉
  ratio_high: 0.10        # ≥10% 文案升级为「重大解禁」

# ── 股东质押（S8 / H7）───────────────────────────────────
pledge:
  total_soft: 1.0         # 重要股东质押合计占总股本 ≥1% → 减分 S8
                          # 用户口径：正常经营很少靠质押融资，1% 即视为异常
  controller_hard: 1.0    # **实控人**质押占总股本 ≥1% → 硬否决 H7
  holder_ratio_hard: 20.0 # **控股股东/实控人质押占其自身持股** ≥20% → 硬否决 H3
                          # 定 20% 的依据（2026-10-20 全市场测算）：
                          # · 全市场质押比例 Top30 中，实控人质押占其持股普遍 70–100%
                          #   （雪发 100%、蓝天燃气 94%、豫园 91%），阈值 10~30% 对它们
                          #   无区分度——真正的差别在「边缘公司」
                          # · 正常公司样本（31 只）除爱尔 22.98% 外全部 <15%
                          # · 20% 正好落在「正常公司上限」与「高危公司下限」之间的空档：
                          #   不误伤正常融资（10–15% 做员工持股/并购贷很常见），
                          #   又能把「押掉两成身家」的公司提前拦住
                          # 与 H7 是两个角度：H7 看「占公司总股本」，H3 看
                          # 「把自己多少身家押出去了」。持股极少的股东即使占总股本
                          # 不到 1%，也可能已质押掉大半持股。
  tolerance: 0.5          # 明细合计与公司整体的容差（pp）：
                          # 明细超出则说明有未回写的解押记录（牧原/分众），
                          # 退回整体口径并放弃股东级归属

# ── 增收不增利（S10）─────────────────────────────────────
revenue_profit:
  rev_min: 0.05           # 营收同比 ≥5% 才谈得上「增收」
  np_ratio: 0.30          # 归母增速 < 营收增速 × 30% 视为「利润没跟上」
  gap_min: 0.05           # 且两者差距 ≥5pp（防止都接近 0 时的误判）

# ── 单季度利润调节（S11）─────────────────────────────────
quarterly:
  q1_share_high: 0.40     # Q1 占全年 ≥40%
  q4_share_low: 0.10      # Q4 占全年 ≤10%
  min_years: 2            # 连续 2 年满足才算「利润前置」
                          # 单年可能是项目确认节奏，连续两年才是稳定的操作习惯

# ── 应收/存货增速背离（S12）───────────────────────────────
# 只比**年报对年报**：季报同比要防季节性（Q3 备货 vs Q1 去库存），
# 年报口径最干净，且与六维、S10/S11 的年报基准一致。
receivable_inventory:
  gap: 0.20               # 增速差 > 20pp 即触发
  min_abs_yi: 1.0         # 科目绝对额 ≥1 亿元才判定
                          # 不加这条会误伤茅台：应收 260 万 → 570 万是 +119%，
                          # 但绝对额连一天的营收都不到，纯基数噪音
  min_rev_ratio: 0.05     # 且占营收 ≥5%（视为「重要科目」）
                          # 两个门槛是「与」关系：先证明这个科目重要，再谈它涨得快

# ── 小市值（S9）──────────────────────────────────────────
mktcap:
  small_yi: 50            # 总市值 < 50 亿元 → 减分
                          # 依据：小市值公司抗风险、流动性、信息透明度均弱于
                          # 大市值，风险与市值负相关；50 亿为 A 股小盘常用分界

# ── 银行净资产折价 ────────────────────────────────────────
bank:
  npl_base: 1.0           # 不良率基准（%）
  npl_penalty_per_pp: 0.15
  prov_base: 250          # 拨备覆盖基准（%）
  prov_penalty_per_100pp: 0.07
  max_penalty: 0.25

# ── 排雷分级 ──────────────────────────────────────────────
risk:
  high_risk_soft: 3       # 减分项 ≥3 → 高危

# ── 情景与仓位 ────────────────────────────────────────────
scenario:
  span: 0.30              # 牛/熊情景锚定公平价 ±30%
position:
  single_max: 0.20        # 个股上限
  industry_max: 0.40      # 单一行业上限
  c_grade_max: 0.05        # C 级单笔上限

# ── 数据源 ────────────────────────────────────────────────
http:
  timeout: 15
  retries: 2
  throttle: 0.3           # 两次请求间隔（秒）

# ── EV/EBITDA 降级模型（PE 口径失效时的兜底，不进主辅配置表）──
# 触发需同时满足：① 微利（PE>pe_high 或 EPS<eps_low）② 重资产（折旧/营收 或 固定资产/总资产 超限）
ev_ebitda:
  trigger:
    pe_high: 80            # PE_TTM 超过此值视为微利（中芯 118.66 触发）
    eps_low: 0.1           # EPS 低于此值视为微利
    dep_rev: 0.15          # 折旧摊销/营收超过此值视为重资产
    fixed_asset: 0.40      # 固定资产/总资产超过此值视为重资产
  # 行业 EV/EBITDA 经验区间 [下限, 上限]：人工标定，非计算得出。
  # 标定依据为行业龙头长期交易区间（台积电 15–20×、宝钢 5–8×、国航 8–12× 等）。
  # 因此本模型结论「方向可靠、幅度不宜精读」，已在 caveat 中显式标注。
  bands:
    default: [8.0, 15.0]
    C39: [12.0, 20.0]      # 计算机通信电子（半导体代工/设计/封测）
    C35: [8.0, 14.0]       # 通用设备
    C36: [8.0, 14.0]       # 专用设备
    C37: [8.0, 14.0]       # 电气机械
    C38: [9.0, 16.0]       # 电气机械（光伏/储能/电池设备）
    C22: [6.0, 10.0]       # 造纸
    C25: [6.0, 10.0]       # 石油加工炼焦
    C28: [8.0, 13.0]       # 化学纤维
    C29: [7.0, 12.0]       # 橡胶塑料
    C30: [7.0, 12.0]       # 非金属矿物（水泥/玻璃）
    C31: [5.0, 9.0]        # 黑色金属冶炼（钢铁）
    C32: [7.0, 12.0]       # 有色金属冶炼
    G53: [8.0, 13.0]       # 铁路运输
    G54: [7.0, 11.0]       # 道路运输
    G55: [6.0, 10.0]       # 水上运输（航运）
    G56: [8.0, 12.0]       # 航空运输
    D44: [7.0, 12.0]       # 电力热力
